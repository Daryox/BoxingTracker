# ByteTrack config tuned for offline skeleton extraction.
#
# The key difference from the default bytetrack.yaml is track_buffer: 500.
# During extraction the model processes frames sequentially as fast as it can.
# A large model like yolo11x may be slow, but the tracker counts frames not
# wall-clock time — so 500 frames means the tracker holds a lost track for
# 500 processed frames (~16 seconds of a 30fps video) before dropping it.
# This prevents fighters from getting new IDs after clinches, occlusions,
# or brief exits from frame.
#
# ReID is intentionally disabled here (no with_reid field = ByteTrack default).
# ByteTrack relies purely on spatial IoU + Kalman filter prediction, which is
# more robust for offline processing than appearance-based ReID which can
# struggle when lighting and pose change across widely-spaced frames.

tracker_type: bytetrack
track_high_thresh: 0.25      # minimum confidence for a detection to start/update a track
track_low_thresh: 0.10       # second-stage association threshold for marginal detections
new_track_thresh: 0.25       # minimum confidence to initialise a brand-new track
track_buffer: 500            # frames to hold a lost track before discarding (~16 s at 30fps)
match_thresh: 0.85           # IoU threshold for track-detection association
fuse_score: True             # fuse detection confidence into the association cost
